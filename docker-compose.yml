version: "3.8"

networks:
  pedidos360-network:
    driver: bridge

volumes:
  postgres_data:

services:
  # 1. Base de Datos (PostgreSQL)
  ms-bd-cloud:
    image: postgres:15-alpine
    container_name: ms-bd-cloud
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ms-bd-cloud/init-dbs.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pedidos360-network

  # 2. Broker de Mensajería (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-broker
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pedidos360-network

  # 3. Microservicio Usuarios
  ms-usuarios-cloud:
    build:
      context: ./ms-usuarios-cloud
    container_name: ms-usuarios-cloud
    ports:
      - "8081:8081"
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-78b145ef-56b9-4397-b87c-27b242a9fce5}
      DB_URL: ${DB_URL_USUARIOS:-jdbc:postgresql://ms-bd-cloud:5432/db_usuarios}
      DB_USERNAME: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASS:-admin}
      SPRING_DATASOURCE_URL: ${DB_URL_USUARIOS:-jdbc:postgresql://ms-bd-cloud:5432/db_usuarios}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS:-admin}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - pedidos360-network

  # 4. Microservicio Producto
  ms-producto:
    build:
      context: ./cloud-backend-producto
    container_name: ms-producto
    ports:
      - "8082:8082"
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-78b145ef-56b9-4397-b87c-27b242a9fce5}
      DB_URL: ${DB_URL_PRODUCTO:-jdbc:postgresql://ms-bd-cloud:5432/db_productos}
      DB_USERNAME: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASS:-admin}
      SPRING_DATASOURCE_URL: ${DB_URL_PRODUCTO:-jdbc:postgresql://ms-bd-cloud:5432/db_productos}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS:-admin}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
    depends_on:
      ms-usuarios-cloud:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - pedidos360-network

  # 5. Microservicio Carrito
  ms-carrito:
    build:
      context: ./cloud-backend-carrito
    container_name: ms-carrito
    ports:
      - "8083:8083"
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-78b145ef-56b9-4397-b87c-27b242a9fce5}
      DB_URL: ${DB_URL_CARRITO:-jdbc:postgresql://ms-bd-cloud:5432/db_carrito}
      DB_USERNAME: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASS:-admin}
      SPRING_DATASOURCE_URL: ${DB_URL_CARRITO:-jdbc:postgresql://ms-bd-cloud:5432/db_carrito}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS:-admin}
      PRODUCTO_API_URL: "http://ms-producto:8082/api/v1/productos"
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
    depends_on:
      ms-producto:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - pedidos360-network

  # 6. Microservicio Órdenes
  ms-ordenes:
    build:
      context: ./cloud-backend-ordenes
    container_name: ms-ordenes
    ports:
      - "8085:8085"
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-78b145ef-56b9-4397-b87c-27b242a9fce5}
      DB_URL: ${DB_URL_ORDENES:-jdbc:postgresql://ms-bd-cloud:5432/db_ordenes}
      DB_USERNAME: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASS:-admin}
      SPRING_DATASOURCE_URL: ${DB_URL_ORDENES:-jdbc:postgresql://ms-bd-cloud:5432/db_ordenes}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS:-admin}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
    depends_on:
      ms-carrito:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - pedidos360-network

  # 7. Microservicio Notificaciones
  ms-notificaciones:
    build:
      context: ./cloud-backend-notificaciones
    container_name: ms-notificaciones
    ports:
      - "8086:8086"
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-78b145ef-56b9-4397-b87c-27b242a9fce5}
      DB_URL: ${DB_URL_NOTIFICACIONES:-jdbc:postgresql://ms-bd-cloud:5432/db_notificaciones}
      DB_USERNAME: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASS:-admin}
      SPRING_DATASOURCE_URL: ${DB_URL_NOTIFICACIONES:-jdbc:postgresql://ms-bd-cloud:5432/db_notificaciones}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS:-admin}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
    depends_on:
      ms-ordenes:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8086/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - pedidos360-network

  # 8. Backend For Frontend (BFF)
  ms-bff:
    build:
      context: ./cloud-backend-bff
    container_name: ms-bff
    ports:
      - "8084:8084"
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-78b145ef-56b9-4397-b87c-27b242a9fce5}
      MS_PRODUCTO_URL: "http://ms-producto:8082"
      MS_CARRITO_URL: "http://ms-carrito:8083"
      MS_USUARIO_URL: "http://ms-usuarios-cloud:8081"
      MS_ORDENES_URL: "http://ms-ordenes:8085"
      MS_NOTIFICACIONES_URL: "http://ms-notificaciones:8086"
      MS_DESPACHO_URL: "http://ms-despacho:8087"
    depends_on:
      ms-producto:
        condition: service_healthy
      ms-carrito:
        condition: service_healthy
      ms-usuarios-cloud:
        condition: service_healthy
      ms-ordenes:
        condition: service_healthy
      ms-notificaciones:
        condition: service_healthy
      ms-despacho:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - pedidos360-network

  # 9. Frontend React
  ms-frontend:
    build:
      context: ./cloud-frontend
      args:
        VITE_REDIRECT_URI: ${VITE_REDIRECT_URI:-http://localhost}
        VITE_BFF_URL: ${VITE_BFF_URL:-http://localhost:8084/api/v1/bff}
    container_name: ms-frontend
    ports:
      - "80:80"
    environment:
      VITE_REDIRECT_URI: ${VITE_REDIRECT_URI:-http://localhost}
      VITE_BFF_URL: ${VITE_BFF_URL:-http://localhost:8084/api/v1/bff}
    depends_on:
      ms-bff:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pedidos360-network
  # 10. Microservicio Despacho
  ms-despacho:
    build:
      context: ./ms-despacho
    container_name: ms-despacho
    ports:
      - "8087:8087"
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-78b145ef-56b9-4397-b87c-27b242a9fce5}
      DB_URL: ${DB_URL_DESPACHO:-jdbc:postgresql://ms-bd-cloud:5432/db_despachos}
      DB_USERNAME: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASS:-admin}
      SPRING_DATASOURCE_URL: ${DB_URL_DESPACHO:-jdbc:postgresql://ms-bd-cloud:5432/db_despachos}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS:-admin}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
    depends_on:
      ms-notificaciones:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8087/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - pedidos360-network

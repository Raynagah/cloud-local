server:
  port: 8084

spring:
  application:
    name: bff

  security: 
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/
          tenant-id: 78b145ef-56b9-4397-b87c-27b242a9fce5

# CONFIGURACIÓN DE ENDPOINTS PARA OPENFEIGN
# 1. Si existe MS_*_URL, usa esa URL específica.
# 2. Si existe AWS_BACKEND_GATEWAY_URL, la usa como base central.
# 3. Si no hay variables (desarrollo local), apunta a localhost en el puerto de cada microservicio.
microservicios:
  usuario:
    url: ${MS_USUARIO_URL:${AWS_BACKEND_GATEWAY_URL:http://localhost:8081}}
  producto:
    url: ${MS_PRODUCTO_URL:${AWS_BACKEND_GATEWAY_URL:http://localhost:8082}}
  carrito:
    url: ${MS_CARRITO_URL:${AWS_BACKEND_GATEWAY_URL:http://localhost:8083}}
  ordenes:
    url: ${MS_ORDENES_URL:${AWS_BACKEND_GATEWAY_URL:http://localhost:8085}}
  notificaciones:
    url: ${MS_NOTIFICACIONES_URL:${AWS_BACKEND_GATEWAY_URL:http://localhost:8086}}
  despachos:
    url: ${MS_DESPACHOS_URL:${AWS_BACKEND_GATEWAY_URL:http://localhost:8087}}
  analytics:
    url: ${MS_ANALYTICS_URL:${AWS_BACKEND_GATEWAY_URL:http://localhost:8089}}
  pagos:
    url: ${MS_PAGOS_URL:${AWS_BACKEND_GATEWAY_URL:http://localhost:8088}}

# Orígenes del frontend autorizados por CORS (separados por coma).
# En AWS: definir CORS_ALLOWED_ORIGINS con la URL real del frontend.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:5173,https://n2mnxks3b7.execute-api.us-east-1.amazonaws.com}

springdoc:
  show-actuator: true
  swagger-ui:
    use-root-path: true
    path: /swagger-ui.html
  api-docs:
    path: /api/bff/v1/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always